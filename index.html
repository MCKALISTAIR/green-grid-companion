<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- iOS / Apple specific -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GridSense" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Prevent text size adjustment on orientation change -->
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>GridSense</title>
  <meta name="description" content="Track UK carbon intensity and find the best times to use clean energy." />
  <meta name="author" content="GridSense" />
  <link rel="manifest" href="/manifest.json" />

  <meta property="og:title" content="GridSense" />
  <meta property="og:description" content="Track UK carbon intensity and find the best times to use clean energy." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icon-512.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@GridSense" />
  <meta name="twitter:image" content="/icon-512.png" />

  <!-- Capacitor / iOS safe area handling -->
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }

    /* Prevent overscroll bounce on iOS */
    html,
    body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    /* Ensure app takes full screen including safe areas */
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      /* Extend background to cover safe areas */
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    #root {
      height: 100%;
      width: 100%;
      /* Ensure root extends into safe areas */
      min-height: calc(100vh + env(safe-area-inset-top) + env(safe-area-inset-bottom));
      min-height: calc(-webkit-fill-available + env(safe-area-inset-top) + env(safe-area-inset-bottom));
    }
  </style>
  <!-- Looking Glass Analytics -->
  <script>
  (function(TRACKING_ID, ENDPOINT) {
    function rnd() { return Math.random().toString(36).substr(2, 9); }
    var vid = localStorage.getItem('_lg_vid') || rnd();
    localStorage.setItem('_lg_vid', vid);
    var sid = sessionStorage.getItem('_lg_sid') || rnd();
    sessionStorage.setItem('_lg_sid', sid);
    function getOS(ua) {
      if (/Windows/.test(ua)) return 'Windows';
      if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
      if (/Android/.test(ua)) return 'Android';
      if (/Mac OS X/.test(ua)) return 'macOS';
      if (/Linux/.test(ua)) return 'Linux';
      return 'Unknown';
    }
    var ua = navigator.userAgent;
    var deviceType = /Mobile/i.test(ua) ? 'Mobile' : /Tablet/i.test(ua) ? 'Tablet' : 'Desktop';
    var browser = (ua.match(/(Chrome|Firefox|Safari|Edg|OPR)/) || ['Unknown'])[1];
    if (browser === 'Edg') browser = 'Edge';
    if (browser === 'OPR') browser = 'Opera';
    var os = getOS(ua);
    function send(payload, useBeacon) {
      var body = JSON.stringify(payload);
      if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon(ENDPOINT, new Blob([body], { type: 'application/json' }));
      } else {
        fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
          .catch(function(e) { console.warn('[LG] track failed', e); });
      }
    }
    var pageStart = Date.now();
    var hasInteracted = false;
    function trackPageview(path) {
      pageStart = Date.now();
      hasInteracted = false;
      var url = new URL(location.href);
      send({
        tracking_id: TRACKING_ID,
        type: 'pageview',
        data: {
          session_id: sid,
          visitor_id: vid,
          path: path || location.pathname,
          referrer: document.referrer || null,
          utm_source:   url.searchParams.get('utm_source'),
          utm_medium:   url.searchParams.get('utm_medium'),
          utm_campaign: url.searchParams.get('utm_campaign'),
          utm_term:     url.searchParams.get('utm_term'),
          utm_content:  url.searchParams.get('utm_content'),
          user_agent:   ua,
          device_type:  deviceType,
          browser:      browser,
          os:           os,
          screen_width:  screen.width,
          screen_height: screen.height,
        }
      }, false);
    }
    function trackPageleave(useBeacon, customPath) {
      var duration = Date.now() - pageStart;
      send({
        tracking_id: TRACKING_ID,
        type: 'pageleave',
        data: {
          session_id:  sid,
          visitor_id:  vid,
          path:        customPath || location.pathname,
          duration_ms: duration,
          is_bounce:   !hasInteracted,
        }
      }, useBeacon);
    }
    function onInteract() { hasInteracted = true; }
    document.addEventListener('click',  onInteract, { once: true, passive: true });
    document.addEventListener('scroll', onInteract, { once: true, passive: true });
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') trackPageleave(true);
      else pageStart = Date.now();
    });
    window.addEventListener('pagehide', function() { trackPageleave(true); });
    function patchHistory(method) {
      var orig = history[method];
      history[method] = function() {
        var fromPath = location.pathname;
        var result = orig.apply(this, arguments);
        trackPageleave(false, fromPath);
        trackPageview(location.pathname);
        return result;
      };
    }
    patchHistory('pushState');
    patchHistory('replaceState');
    window.addEventListener('popstate', function() {
      trackPageleave(false);
      trackPageview(location.pathname);
    });
    window.lgTrack = function(name, props) {
      hasInteracted = true;
      send({
        tracking_id: TRACKING_ID,
        type: 'event',
        data: {
          session_id: sid,
          visitor_id: vid,
          name:       name,
          properties: props || {},
          path:       location.pathname,
        }
      }, false);
    };
    trackPageview();
  })('LG-GREEN-GRID-COMPANION', 'https://qncktpkapwrfsioqeofr.supabase.co/functions/v1/track');
  </script>
</head>

<body>
  <div id="root"></div>

  <script>
    // Prevent stale Service Worker caches from breaking the dev preview.
    // Some browsers can keep an old SW controlling the page, serving outdated
    // JS chunks which leads to React hook crashes and even "HTTP ERROR 412".
    // NOTE: Skip this in Capacitor native apps (they run on capacitor:// or ionic:// schemes)
    (function () {
      try {
        var protocol = window.location.protocol || '';
        // Skip for native Capacitor apps (capacitor://, ionic://, file://)
        if (protocol === 'capacitor:' || protocol === 'ionic:' || protocol === 'file:') return;

        // Also check for Capacitor in userAgent (fallback detection)
        if (window.navigator && /Capacitor/i.test(window.navigator.userAgent)) return;

        var host = window.location.hostname || '';
        var isDevPreview = host.endsWith('.lovableproject.com');
        // Don't trigger on localhost for Capacitor compatibility
        if (!isDevPreview) return;
        if (!('serviceWorker' in navigator)) return;

        var key = 'gridsense_sw_cleared_v1';
        if (sessionStorage.getItem(key)) return;

        var hadSW = false;
        var hadCache = false;
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            hadSW = regs.length > 0;
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }),
          ('caches' in window)
            ? caches.keys().then(function (names) {
                hadCache = names.length > 0;
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              })
            : Promise.resolve(),
        ]).finally(function () {
          sessionStorage.setItem(key, '1');
          if (hadSW || hadCache) window.location.reload();
        });
      } catch (e) {
        // no-op
      }
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
