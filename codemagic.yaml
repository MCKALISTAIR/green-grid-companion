# Codemagic CI for the GridSense iOS app (Capacitor 7 + WidgetKit extension).
#
# What this does: builds the web app, syncs it into the native iOS project,
# signs the app AND the GridSenseWidget extension with automatic code signing
# (App Store Connect API key), and uploads the .ipa to App Store Connect so it
# appears in TestFlight for INTERNAL testers.
#
# What this never does: submit for App Review or external (beta) review.
# `submit_to_app_store` and `submit_to_testflight` are both false on purpose.
#
# One-time setup in Codemagic (see docs/ios-codemagic.md):
#   1. Team settings > Integrations > Developer Portal: add the App Store Connect
#      API key and name it exactly as in `integrations.app_store_connect` below.
#   2. App settings > Environment variables, group `ios_signing`:
#        CERTIFICATE_PRIVATE_KEY  (secret) RSA private key for the iOS
#                                 Distribution certificate.
#   3. Optional, group `gridsense_web`:
#        VITE_SENTRY_DSN          (secret) Sentry DSN for the bundled web app.
#        APP_STORE_APPLE_ID       numeric Apple ID of the App Store Connect app
#                                 record, used to pick the next build number.

workflows:
  ios-testflight:
    name: iOS → TestFlight (internal)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # PLACEHOLDER: must match the key name you give in Codemagic.
      app_store_connect: GridSense ASC key
    environment:
      groups:
        - ios_signing
        - gridsense_web
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # PLACEHOLDER bundle IDs. Must match PRODUCT_BUNDLE_IDENTIFIER in
        # ios/App/App.xcodeproj and the identifiers registered in the Apple
        # Developer portal.
        BUNDLE_ID: com.greengrid.companion
        WIDGET_BUNDLE_ID: com.greengrid.companion.widget
      node: 22
      xcode: latest
    # No `triggering` block: builds are started manually from Codemagic until
    # the Apple side is set up. To build on every push to main, add:
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    scripts:
      - name: Install Bun
        script: |
          # The repo is locked with bun.lock (same as .github/workflows/a11y.yml);
          # package-lock.json is out of date, so `npm ci` fails.
          curl -fsSL https://bun.sh/install | bash
          echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"

      - name: Install web dependencies
        script: bun install --frozen-lockfile

      - name: Build web app
        script: |
          export VITE_APP_VERSION="$(node -p "require('./package.json').version")"
          bun run build

      - name: Sync Capacitor iOS project
        script: bunx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing files (app + widget)
        script: |
          # Creates the App Store provisioning profiles (and the Distribution
          # certificate from CERTIFICATE_PRIVATE_KEY) if they don't exist yet.
          # The bundle IDs must already have App Groups, Push Notifications and
          # Sign in with Apple enabled in the Apple Developer portal.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Pick build number
        script: |
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
            NEXT=$((LATEST + 1))
          else
            NEXT="$BUILD_NUMBER"
          fi
          echo "Using CFBundleVersion $NEXT"
          echo "GS_BUILD_NUMBER=$NEXT" >> "$CM_ENV"

      - name: Build signed .ipa
        script: |
          # CURRENT_PROJECT_VERSION is passed to every target so the app and the
          # widget extension always share the same CFBundleVersion.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$GS_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Upload only. The build shows up in TestFlight for internal testers.
        # Never submit for review from CI; Alistair does that by hand.
        submit_to_testflight: false
        submit_to_app_store: false
