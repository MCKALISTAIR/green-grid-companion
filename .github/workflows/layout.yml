name: Layout guard

# Playwright layout regression checks (scripts/layout-guard.mjs): hero elements
# never overlap, the stale reading hides the zero-carbon badge, the scalloped
# sheet edge has no gaps, and pages don't leave empty scroll space below their
# content. All external APIs are mocked, so no secrets are needed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Layout guard (Playwright)
    runs-on: ubuntu-latest
    # The guard itself takes ~2 min; 10 min leaves room for installs without letting a hang burn 20.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: node node_modules/playwright/cli.js install-deps chromium

      - name: Build production bundle
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

      - name: Run layout guard
        timeout-minutes: 8
        run: node scripts/layout-guard.mjs
