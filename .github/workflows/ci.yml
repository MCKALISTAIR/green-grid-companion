name: CI

# One job for every check (typecheck, lint, unit tests, bundle check, layout
# guard, axe audit) so install, Playwright setup and build happen once per run
# instead of once per workflow. Actions minutes on this private repo come from
# the free monthly allowance, so the triggers below skip runs that add nothing:
#   - draft PRs (marking a PR ready for review runs it)
#   - pushes to main that are PR merges, since the PR was already checked;
#     Lovable commits land on main directly and still get a check
#   - changes that only touch Markdown or docs/
#   - a newer push to the same PR or branch cancels the older run
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'Merge pull request #') &&
        !contains(github.event.head_commit.message, '(#'))
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Steps after install run even when an earlier check fails, so one run
    # reports every failure rather than stopping at the first.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: No em dashes in copy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-no-em-dash.mjs

      - name: Lint (errors fail, warnings allowed)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint .

      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check .

      - name: Unit tests (Vitest on Node)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vite build
        env:
          # Publishable (anon) keys, safe to expose; src/integrations/supabase/client.ts
          # falls back to project defaults when they are absent.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

      - name: Dev/QA pages are not in the production bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if grep -rlE "Scene Visual Test|GridSense Design System|Turbine animation test" dist/assets/*.js; then
            echo "::error::Dev/QA page code found in production bundle" >&2
            exit 1
          fi

      - name: Cache Playwright browsers
        id: pw-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}

      # Use the workspace playwright CLI so the browser revision matches
      # `import { chromium } from "playwright"` in the scripts (bunx alone can
      # resolve a newer CLI and install the wrong revision).
      - name: Install Playwright Chromium
        id: playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            node node_modules/playwright/cli.js install-deps chromium
          else
            node node_modules/playwright/cli.js install --with-deps chromium
          fi

      # Playwright layout regression checks (scripts/layout-guard.mjs): hero
      # elements never overlap, the stale reading hides the zero-carbon badge,
      # the scalloped sheet edge has no gaps, and pages don't leave empty scroll
      # space below their content. Serves dist/ with vite preview; all external
      # APIs are mocked, so no secrets are needed.
      - name: Layout guard
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' }}
        timeout-minutes: 8
        run: node scripts/layout-guard.mjs

      # The axe audit also checks /__design-system, which production builds
      # leave out, so rebuild dist/ with dev routes on. This must come after
      # the bundle check and layout guard, which need the production build.
      - name: Build with dev routes for the axe audit
        id: build-a11y
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_ENABLE_DEV_ROUTES: 'true'

      - name: Accessibility audit (axe)
        if: ${{ !cancelled() && steps.build-a11y.outcome == 'success' && steps.playwright.outcome == 'success' }}
        timeout-minutes: 6
        run: bun scripts/a11y-audit.ts

      - name: Locate a11y report
        id: report
        if: ${{ !cancelled() && steps.build-a11y.outcome == 'success' }}
        run: |
          REPORT=$(ls -1 docs/a11y/*.md 2>/dev/null | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -n 1 || true)
          if [ -z "$REPORT" ]; then
            echo "No dated report found." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$REPORT" .md)" >> "$GITHUB_OUTPUT"

      - name: Upload a11y report artifact
        if: ${{ !cancelled() && steps.report.outputs.found == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ steps.report.outputs.name }}
          path: docs/a11y/*.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Comment a11y summary on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.report.outputs.found == 'true' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ steps.report.outputs.path }}';
            const body = fs.readFileSync(path, 'utf8');
            // GitHub PR comments cap at 65,536 chars, so truncate defensively.
            const MAX = 60000;
            const truncated = body.length > MAX
              ? body.slice(0, MAX) + `\n\n…truncated. Download the full report from the workflow artifacts.`
              : body;
            const marker = '<!-- a11y-audit-report -->';
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              const finalBody = `${marker}\n${truncated}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: finalBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: finalBody,
                });
              }
            } catch (err) {
              core.warning(`Could not comment a11y report on PR: ${err.message}`);
            }
