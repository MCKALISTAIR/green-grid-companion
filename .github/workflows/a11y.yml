name: Accessibility audit

on:
  pull_request:
    branches: [main]
  # Lovable commits straight to main, so audit those too.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  axe:
    name: axe-core (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        # Use the workspace playwright CLI so browser revision matches
        # `import { chromium } from "playwright"` in scripts/a11y-audit.ts
        # (bunx alone can resolve a newer CLI and install the wrong revision).
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build production bundle
        run: bun run build
        env:
          # Vite needs the publishable Supabase keys at build time. They are safe
          # to expose (anon/publishable) and fall back to project defaults via
          # src/integrations/supabase/client.ts when absent.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          # Dev/QA routes are off in production builds; the audit still checks
          # /__design-system, so opt in for this CI-only build.
          VITE_ENABLE_DEV_ROUTES: 'true'

      - name: Run axe audit
        id: audit
        run: bun scripts/a11y-audit.ts

      - name: Locate report
        id: report
        if: always()
        run: |
          REPORT=$(ls -1 docs/a11y/*.md 2>/dev/null | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -n 1 || true)
          if [ -z "$REPORT" ]; then
            echo "No dated report found." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$REPORT" .md)" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        if: always() && steps.report.outputs.found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ steps.report.outputs.name }}
          path: docs/a11y/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request' && steps.report.outputs.found == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ steps.report.outputs.path }}';
            const body = fs.readFileSync(path, 'utf8');
            // GitHub PR comments cap at 65,536 chars — truncate defensively.
            const MAX = 60000;
            const truncated = body.length > MAX
              ? body.slice(0, MAX) + `\n\n…truncated. Download the full report from the workflow artifacts.`
              : body;
            const marker = '<!-- a11y-audit-report -->';
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              const finalBody = `${marker}\n${truncated}`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: finalBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: finalBody,
                });
              }
            } catch (err) {
              core.warning(`Could not comment a11y report on PR: ${err.message}`);
            }
